server:
  port: 8001
  request

spring:
  main:
    web-application-type: reactive
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: redis-service
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000            
        response-timeout: 10s
      default-filters:
        - name : GlobalFilter
          args :
            baseMessage : Spring Cloud Gateway Global Filter
            preLogger   : true
            postLogger  : true
      routes:
        - id : authservice
          uri: https://authservice-service:443
          #uri : https://127.0.0.1:443
          predicates : 
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /$\{segment}
            - name : JwtAuthenticationFilter
              args :
                excludePaths :
                  - POST:/login/*
                  - POST:/logout/*
                  - POST:/users
                  - GET:/address
                  - GET:/address/*
                  - POST:/jwt/reissue

jwt:
  header : Authorization #X-AUTH-TOKEN
  secretkey : ${JWT_SECRET} 
  access-Token-expiration : 3600000    # 60 * 60 * 1000L ( 1시간 )
  refresh-token-expiration : 604800000 #7 * 24 * 60 * 60 * 1000L ( 7일 )

logging:
  level:
    ROOT: INFO
    org.hibernate: DEBUG
    org.springframework.web: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.security: DEBUG
    org.springframework.security.web: INFO

    # Actuator
    org.springframework.boot.actuate: INFO
    org.springframework.boot.actuate.endpoint.web.servlet: INFO 
    org.springframework.boot.actuate.metrics: INFO
    com.netflix.discovery.DiscoveryClient: ERROR
    org.apache.hc.client5.http.headers: INFO
    org.apache.hc.client5.http.impl.classic: INFO
    org.apache.hc.client5.http.impl.io: INFO
    org.apache.hc.client5.http.impl: INFO
    org.apache.hc.client5: INFO
    org.springframework.web.client.RestTemplate: INFO
    sun.rmi: WARN
    javax.management.remote.rmi: WARN

management:
  server:
    port: 9001                          
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
