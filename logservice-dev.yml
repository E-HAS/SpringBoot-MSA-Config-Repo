server:
  port: 514
  shutdown: graceful          # K8s 롤링 업데이트 시 처리 중인 요청 마무리

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:30036}/${MYSQL_DATABASE:log_db}?characterEncoding=UTF-8&serverTimezone=UTC
    #url: jdbc:mariadb://127.0.0.1:3306/log_db?characterEncoding=UTF-8&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    #driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        ddl-auto: update
        show_sql: true         #모든 SQL문을 콘솔로 출력
        format_sql: true       #JPA 실행쿼리 가독성있게 표현
        use_sql_comments: true #SQL문 이외에 추가적인 정보 출력
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
  security:
    user:
      name: root
      password: rootpassword
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:30379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
      database: 0
      
logging:
  level:
    ROOT: DEBUG
    com.msa.auth: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

    sun.rmi: OFF
    sun.rmi.loader: OFF
    sun.rmi.transport: OFF
    sun.rmi.transport.tcp: OFF
    
    com.zaxxer.hikari: INFO

value:
  log:
    storage:
      base-dir: ./data/log-spool
      flush-batch-size: 2000
      flush-interval-ms: 1000
      process-interval-ms: 1000
      max-files-per-cycle: 50
      db-chunk-size: 1000
      max-orphan-retry: 5
      req-cache-ttl-ms: 180000
      redis-loaded-ttl-seconds: 600 
      redis-recent-buckets-limit: 30
  kafka:
    bootstrap-servers: ${KAFKA_SERVICE_URI:127.0.0.1:9092}
    consumer:
          group-id: ${KAFKA_GROUP_ID:order-service-group}
          auto-offset-reset: earliest
          enable-auto-commit: false
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          partition-assignment-strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
          concurrency: 3
    topics:
      log: log-topic
      log-req-topic: reqLogs
      log-step-topic: stepLogs
      log-res-topic: resLogs
      
management:                        
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
 